<body>
  <!-- Header -->
  <esi:include src="/includes/header.html" />

  <!-- Navigation Bar -->
  <esi:include src="/includes/navbar.html" />

  <!-- Marquee -->
  <esi:include src="/includes/marquee.html" />

  <!-- Spacer for when marquee becomes fixed -->
  <div id="marquee-placeholder" style="display: none"></div>

  <main>
    <section class="speakers-section">
      <div class="speakers-container">
        <div class="page-title-container">
          <h1 class="page-title">Speakers</h1>
        </div>

        <p class="page-intro">
          Meet the speakers presenting special sessions, tutorials and keynotes
          at IPRECON 2026.
        </p>

        <!-- Each .speaker-group is self-contained and carries no order-dependent
             styling, so these sections can be reordered by moving the block. -->
        <section class="speaker-group" id="special-session-speakers">
          <div class="section-title-container">
            <h2 class="section-title">Special Session Speakers</h2>
          </div>

          <div class="speaker-grid">
            <a class="speaker-card-link" href="./special-sessions.html#session-synchronous-condensers">
              <figure class="speaker-card">
                <div class="speaker-photo">
                  <img src="images/Bernd Thormann.jpeg" alt="Mr. Bernd Thormann" width="240" height="300"
                    loading="lazy" decoding="async" />
                </div>
                <figcaption class="speaker-meta">
                  <h3 class="speaker-name">Mr. Bernd Thormann</h3>
                  <p class="speaker-role">Technical Product Manager &ndash; Grid Stability</p>
                  <p class="speaker-affiliation">ANDRITZ HYDRO GmbH, Austria</p>
                </figcaption>
              </figure>
            </a>

            <a class="speaker-card-link" href="./special-sessions.html#session-predictive-maintenance">
              <figure class="speaker-card">
                <div class="speaker-photo">
                  <img src="images/Oluwaseun Yinka Irewusi.jpeg" alt="Oluwaseun Yinka Irewusi" width="240" height="300"
                    loading="lazy" decoding="async" />
                </div>
                <figcaption class="speaker-meta">
                  <h3 class="speaker-name">Oluwaseun Yinka Irewusi</h3>
                  <p class="speaker-role">Executive Director &amp; Senior Energy Consultant</p>
                  <p class="speaker-affiliation">Syminertias Nigeria Limited, Nigeria</p>
                </figcaption>
              </figure>
            </a>

            <a class="speaker-card-link" href="./special-sessions.html#session-optical-concentrators">
              <figure class="speaker-card">
                <div class="speaker-photo">
                  <img src="images/Roberto Ramirez Iniguez.jpeg" alt="Roberto Ramirez Iniguez" width="240" height="300"
                    loading="lazy" decoding="async" />
                </div>
                <figcaption class="speaker-meta">
                  <h3 class="speaker-name">Roberto Ramirez Iniguez</h3>
                  <p class="speaker-role">Reader, School of Science and Engineering</p>
                  <p class="speaker-affiliation">Glasgow Caledonian University, United Kingdom</p>
                </figcaption>
              </figure>
            </a>
          </div>
        </section>

        <section class="speaker-group" id="tutorial-speakers">
          <div class="section-title-container">
            <h2 class="section-title">Tutorial Speakers</h2>
          </div>

          <div class="speaker-grid">
            <a class="speaker-card-link" href="./tutorials.html#session-power-quality">
              <figure class="speaker-card">
                <div class="speaker-photo">
                  <img src="images/Dr. Sincy George.jpeg" alt="Dr. Sincy George" width="240" height="300"
                    loading="lazy" decoding="async" />
                </div>
                <figcaption class="speaker-meta">
                  <h3 class="speaker-name">Dr. Sincy George</h3>
                  <p class="speaker-role">Former Principal</p>
                  <p class="speaker-affiliation">
                    St. Francis Institute of Technology (SFIT), Mumbai, India
                  </p>
                </figcaption>
              </figure>
            </a>

            <a class="speaker-card-link" href="./tutorials.html#session-power-quality">
              <figure class="speaker-card">
                <div class="speaker-photo">
                  <img src="images/George Sebastian.jpeg" alt="Mr. George Sebastian" width="240" height="300"
                    loading="lazy" decoding="async" />
                </div>
                <figcaption class="speaker-meta">
                  <h3 class="speaker-name">Mr. George Sebastian</h3>
                  <p class="speaker-role">Former Associate Director</p>
                  <p class="speaker-affiliation">
                    Nuclear Power Corporation of India (NPCIL), India
                  </p>
                </figcaption>
              </figure>
            </a>
          </div>
        </section>

        <section class="speaker-group" id="keynote-speakers">
          <div class="section-title-container">
            <h2 class="section-title">Keynote Speakers</h2>
          </div>

          <div class="tba-panel">
            <div class="tba-icon">
              <i class="fas fa-microphone-lines" aria-hidden="true"></i>
            </div>
            <h3 class="tba-heading">To Be Announced</h3>
            <p class="tba-text">
              Our keynote lineup is being finalised. This section will be updated
              as soon as the speakers are confirmed.
            </p>
          </div>
        </section>
      </div>
    </section>
  </main>

  <!-- Footer section -->
  <esi:include src="/includes/footer.html" />

  <script src="./scripts/script.js"></script>

</html>
